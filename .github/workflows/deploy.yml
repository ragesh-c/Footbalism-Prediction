name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject config from GitHub Secrets
        run: |
          cat > assets/js/config.js << EOF
          const CONFIG = {
            SHEETS_API_KEY: "${{ secrets.SHEETS_API_KEY }}",
            FOOTBALL_API_KEY: "${{ secrets.FOOTBALL_API_KEY }}" || atob("ODM0MWM5YjU4MDUzNDhkZDkxNzcxOGQ4ZmZiYzljMDc="),
            SHEET_ID: "${{ secrets.SHEET_ID }}",
            SHEET_NAME: "${{ secrets.SHEET_NAME || 'Sheet1' }}",
            COL_NUMBER: 1,
            COL_NAME: 2,
            COL_DATA_START: 3,
            COL_TOTAL: -1,
            ADMIN_PASSKEY: "${{ secrets.ADMIN_PASSKEY }}",
            STREAK_MIN_DAYS: 7,
            CONTEST_START: "2026-06-12",
            CONTEST_END: "2026-07-19",
            LEADERBOARD_REFRESH_MS: 60000,
            FIXTURES_REFRESH_MS: 600000,
            FIXTURES_LIVE_REFRESH_MS: 120000,
          };
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          # .gitignore must not be published: it lists assets/js/config.js,
          # which makes the action's git-add skip the injected config.
          exclude_assets: '.github,.gitignore,config.example.js,README.md'
          # Don't delete files already on gh-pages — the live-data workflow
          # publishes assets/data/live/*.json there between site deploys.
          keep_files: true
