<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · Footbalism WC 2026</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--sp-2xl);
    }
    .error-page__code {
      font-family: var(--f-display);
      font-size: clamp(6rem, 20vw, 14rem);
      color: var(--c-accent);
      line-height: 1;
      letter-spacing: 0.04em;
    }
    .error-page__msg {
      font-family: var(--f-display);
      font-size: var(--text-3xl);
      color: var(--c-white);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: var(--sp-md);
    }
    .error-page__sub {
      color: var(--c-muted);
      margin-bottom: var(--sp-2xl);
    }
  </style>
</head>
<body>
  <main class="error-page">
    <div>
      <p class="error-page__code">404</p>
      <p class="error-page__msg">Offside</p>
      <p class="error-page__sub">That page doesn't exist. The ref's called it.</p>
      <a href="/" class="btn btn--primary">Back to Standings →</a>
    </div>
  </main>
</body>
</html>
