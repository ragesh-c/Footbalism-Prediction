<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Footbalism WC 2026</title>
  <link rel="stylesheet" href="assets/css/main.css?v=1.0.3">
  <link rel="stylesheet" href="assets/css/admin.css?v=1.0.3">
  <script src="assets/js/config.js?v=1.0.3"></script>
</head>
<body>

  <main class="admin-page">
    <div class="admin-card">

      <p class="admin-card__logo">F<span class="logo-emoji">⚽</span><span class="logo-emoji">⚽</span>T<span class="logo-emoji">🅱️</span><span class="logo-emoji">🅰️</span>LIS<span class="logo-emoji">Ⓜ️</span></p>
      <h1 class="admin-card__title">Admin Panel</h1>
      <p class="admin-card__desc">
        Use this panel to manually upload updated contest data when
        the Google Sheets API is unavailable or you want to push a
        specific snapshot to the leaderboard.
      </p>

      <div id="admin-container">
        <!-- Auth form -->
        <div id="admin-auth">
          <div class="auth-form">
            <div>
              <label class="input-label" for="admin-pass">Passkey</label>
              <input
                class="input-field"
                type="password"
                id="admin-pass"
                placeholder="Enter admin passkey"
                autocomplete="current-password"
              >
            </div>
            <button class="btn btn--primary" id="admin-login">Unlock Panel</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/admin.js?v=1.0.3"></script>

  <!-- Vercel Web Analytics & Speed Insights -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
